# ============================================
# StemComposer — Continuous Deployment
# ============================================
# Rulează DOAR după ce CI-ul trece pe branch-ul main.
# Build & push imagini Docker → Deploy pe server.

name: CD — Build, Push & Deploy

on:
  workflow_run:
    workflows: ["CI — Lint, Test & Build"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  DJANGO_IMAGE: ghcr.io/${{ github.repository }}/django
  DEMUCS_IMAGE: ghcr.io/${{ github.repository }}/demucs

jobs:
  # ──────────────────────────────────────────
  # 1. BUILD & PUSH — Imagini Docker
  # ──────────────────────────────────────────
  build-and-push:
    name: 🚀 Build & Push Docker Images
    runs-on: ubuntu-latest
    # Rulează doar dacă CI-ul a trecut cu succes
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login la GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata pentru Django image
        id: meta-django
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DJANGO_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & Push Django Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-django.outputs.tags }}
          labels: ${{ steps.meta-django.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata pentru Demucs image
        id: meta-demucs
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DEMUCS_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & Push Demucs AI Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.meta-demucs.outputs.tags }}
          labels: ${{ steps.meta-demucs.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # 2. DEPLOY — Pe serverul de producție
  # ──────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Deploy pe server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/stemcomposer' }}

            # Pull ultimele imagini
            docker pull ${{ env.DJANGO_IMAGE }}:latest
            docker pull ${{ env.DEMUCS_IMAGE }}:latest

            # Actualizare docker-compose
            git pull origin main

            # Restart cu noile imagini
            docker compose down
            docker compose up -d

            # Aplicare migrații Django
            docker compose exec -T django python manage.py migrate --noinput

            # Colectare fișiere statice
            docker compose exec -T django python manage.py collectstatic --noinput

            echo "✅ Deploy finalizat cu succes!"

      - name: Verificare health check
        run: |
          echo "⏳ Așteptăm 15 secunde pentru pornirea serviciilor..."
          sleep 15
          echo "✅ Deploy inițiat. Verificați manual serverul de producție."
