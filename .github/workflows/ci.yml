# ============================================
# StemComposer — Continuous Integration
# ============================================
# Rulează la fiecare push și pull request.
# Jobs: lint, test (Django), docker-build

name: CI — Lint, Test & Build

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main]

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  # ──────────────────────────────────────────
  # 1. LINT — Verifică codul Python cu flake8
  # ──────────────────────────────────────────
  lint:
    name: 🧹 Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Instalare flake8
        run: pip install flake8

      - name: Rulare flake8 — erori critice
        run: |
          # Oprire la erori de sintaxă sau variabile nedefinite
          flake8 app/ core/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Rulare flake8 — avertismente
        run: |
          # Avertismente (nu opresc pipeline-ul)
          flake8 app/ core/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  # ──────────────────────────────────────────
  # 2. TEST — Teste Django + Coverage
  # ──────────────────────────────────────────
  test:
    name: 🧪 Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalare dependințe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificare sistem Django
        run: python manage.py check --deploy 2>&1 || true

      - name: Verificare migrații
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Rulare teste cu coverage
        env:
          DJANGO_SECRET_KEY: "test-secret-key-for-ci-only"
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: |
          coverage run manage.py test app -v2
          coverage report --fail-under=70
          coverage xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────
  # 3. DOCKER BUILD — Verificare Dockerfile-uri
  # ──────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Django Image (verificare)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: stemcomposer-django:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI/Demucs Image (verificare)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: false
          tags: stemcomposer-demucs:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
