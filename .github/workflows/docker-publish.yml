# ============================================
# StemComposer — Docker Image Publishing
# ============================================
# Publică imagini Docker versionabile la crearea unui tag v*.
# Exemplu: git tag v1.0.0 && git push --tags

name: Docker — Publish Versioned Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  DJANGO_IMAGE: ghcr.io/${{ github.repository }}/django
  DEMUCS_IMAGE: ghcr.io/${{ github.repository }}/demucs

jobs:
  publish:
    name: 📦 Publish Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login la GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Django Image ----
      - name: Metadata Django
        id: meta-django
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DJANGO_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & Push Django Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-django.outputs.tags }}
          labels: ${{ steps.meta-django.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Demucs AI Image ----
      - name: Metadata Demucs
        id: meta-demucs
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DEMUCS_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & Push Demucs AI Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.meta-demucs.outputs.tags }}
          labels: ${{ steps.meta-demucs.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
